name: MarkAI CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check script.js
      - run: node --check frontend/modules/core_state.js
      - run: node --check frontend/modules/ui_dom.js
      - run: node --check frontend/modules/markitdown_engine.js
      - run: node --check frontend/modules/workspace_store.js
      - run: node --check frontend/modules/workspace_controller.js
      - run: node --check frontend/modules/workspace_ui_controller.js
      - run: node --check frontend/modules/queue_ui_controller.js
      - run: node --check frontend/modules/youtube_controller.js
      - run: node --check frontend/modules/editor_controller.js
      - run: node --check frontend/modules/editor_ui_controller.js
      - run: node --check frontend/modules/file_parser.js
      - run: node --check frontend/modules/url_fetcher.js
      - run: node --check frontend/modules/url_ui_controller.js
      - run: node --check frontend/modules/merge_engine.js
      - run: node --check frontend/modules/conversion_controller.js
      - run: node --check frontend/modules/ai_engine.js
      - run: node --check frontend/modules/ai_ui_controller.js
      - run: node --check frontend/modules/chat_formatter.js
      - run: node --check frontend/modules/conversion_quality.js
      - run: node --check frontend/modules/video_evidence_timeline.js
      - run: node --check video_automation_validator.js
      - run: node --check frontend/modules/video_automation_controller.js
      - run: node --check frontend/modules/settings_controller.js
      - run: node --check frontend/modules/devtrail_formatters.js
      - run: node --check frontend/modules/devtrail_analyzer.js
      - run: node --check frontend/modules/devtrail_specification.js
      - run: node --check frontend/modules/devtrail_replay_plan.js
      - run: node --check frontend/modules/devtrail_replay_validator.js
      - run: node --check frontend/modules/devtrail_audit.js
      - run: node --check frontend/modules/devtrail_quality.js
      - run: node --check frontend/modules/devtrail_readiness.js
      - run: node --check frontend/modules/devtrail_package.js
      - run: node --check frontend/modules/devtrail_drift.js
      - run: node --check frontend/modules/devtrail_controller.js
      - run: node --check extension/content.js
      - run: node --check extension/autonomous_agent.js
      - run: node --check extension/autonomous_dom_scanner.js
      - run: node --check extension/autonomous_network_capture.js
      - run: node --check extension/autonomous_event_correlator.js
      - run: node --check extension/autonomous_system_map.js
      - run: node --check extension/autonomous_system_map_markdown.js
      - run: node --check extension/autonomous_planner.js
      - run: node --check extension/autonomous_executor.js
      - run: node --check extension/autonomous_cycle.js
      - run: node --check tests/test_devtrail_autonomous_final_e2e.js
      - run: node --check extension/background.js
      - run: node --check extension/popup.js
      - name: Run frontend tests
        shell: bash
        run: |
          set -Eeuo pipefail

          tests=(
            tests/test_video_evidence_timeline.js
            tests/test_video_automation_validator.js
            tests/test_video_automation_controller.js
            tests/test_video_review_e2e.js
            tests/test_settings_controller.js
            tests/test_core_state.js
            tests/test_ui_dom.js
            tests/test_workspace_store.js
            tests/test_workspace_controller.js
            tests/test_workspace_ui_controller.js
            tests/test_queue_ui_controller.js
            tests/test_youtube_controller.js
            tests/test_editor_controller.js
            tests/test_editor_ui_controller.js
            tests/test_file_parser.js
            tests/test_url_fetcher.js
            tests/test_url_ui_controller.js
            tests/test_merge_engine.js
            tests/test_conversion_controller.js
            tests/test_ai_engine.js
            tests/test_ai_ui_controller.js
            tests/test_comparison_ui_controller.js
            tests/test_file_actions_ui_controller.js
            tests/test_bootstrap_dependency_order.js
            tests/test_portal_regression.js
            tests/test_public_backend_config.js
            tests/test_public_backend_persistence.js
            tests/test_release_candidate.js
            tests/test_chat_formatter.js
            tests/test_conversion_quality.js
            tests/test_queue_ingestion.js
            tests/test_devtrail_formatters.js
            tests/test_devtrail_analyzer.js
            tests/test_devtrail_specification.js
            tests/test_devtrail_controller.js
            tests/test_devtrail_contract.js
            tests/test_devtrail_replay_validator.js
            tests/test_devtrail_audit.js
            tests/test_devtrail_drift.js
            tests/test_devtrail_final_e2e.js
            tests/test_devtrail_autonomous_agent.js
            tests/test_devtrail_autonomous_dom_scanner.js
            tests/test_devtrail_autonomous_network_capture.js
            tests/test_devtrail_autonomous_event_correlator.js
            tests/test_devtrail_autonomous_system_map.js
            tests/test_devtrail_autonomous_system_map_markdown.js
            tests/test_devtrail_autonomous_planner.js
            tests/test_devtrail_autonomous_executor.js
            tests/test_devtrail_autonomous_cycle.js
            tests/test_devtrail_autonomous_control_panel.js
            tests/test_devtrail_autonomous_final_e2e.js
          )

          for test in "${tests[@]}"; do
            echo "::group::$test"
            echo "Running $test"
            if ! node "$test"; then
              echo "::error title=Frontend test failed::$test"
              exit 1
            fi
            echo "::endgroup::"
          done
